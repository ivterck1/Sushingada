name: Verificar plantilla gastronómica

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run menu:business:check && npm run menu:html:check && npm run seo:check
      - run: npm run build:site -- "$RUNNER_TEMP/landing-public"
      - run: SITE_ARTIFACT="$RUNNER_TEMP/landing-public" npm run test:site
